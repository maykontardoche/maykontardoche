<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Maykon Tardoche — Software Engineer full-stack. Backend, banco de dados e produto de ponta a ponta, do schema no Postgres ao shader na GPU.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .kicker { font-size: 13px; letter-spacing: 2px; fill: #3fb950; }
    .name { font-size: 78px; font-weight: 800; letter-spacing: -3px; fill: #f0f6fc; }
    .role { font-size: 23px; font-weight: 600; fill: #c9d1d9; }
    .sub { font-size: 17px; fill: #8b949e; }
    .meta { font-size: 13.5px; fill: #6e7681; }
    .t { font-size: 15px; fill: #c9d1d9; }
    .p { fill: #3fb950; }
    .c { fill: #f0f6fc; }
    .d { fill: #6e7681; }
    .ok { fill: #3fb950; }
    .a { fill: #00d9ff; }
    .v { fill: #bd93f9; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161b22"/>
    </pattern>
    <radialGradient id="g1" cx=".12" cy=".1" r=".7">
      <stop offset="0" stop-color="#00d9ff" stop-opacity=".16"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".95" cy="1" r=".65">
      <stop offset="0" stop-color="#bd93f9" stop-opacity=".18"/><stop offset="1" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#bd93f9;#00d9ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#bd93f9">
        <animate attributeName="stop-color" values="#bd93f9;#00d9ff;#bd93f9" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="16"/></clipPath>
    <!-- uma máscara por linha "digitada" do terminal; sem SMIL, o texto aparece inteiro -->
    <clipPath id="l1"><rect x="664" y="112" height="24" width="460"><set attributeName="width" to="0" begin="0s"/><animate attributeName="width" to="460" dur=".5s" begin=".6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="664" y="136" height="24" width="460"><set attributeName="width" to="0" begin="0s"/><set attributeName="width" to="460" begin="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="664" y="172" height="24" width="460"><set attributeName="width" to="0" begin="0s"/><animate attributeName="width" to="460" dur=".55s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="664" y="196" height="24" width="460"><set attributeName="width" to="0" begin="0s"/><set attributeName="width" to="460" begin="2.65s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="664" y="232" height="24" width="460"><set attributeName="width" to="0" begin="0s"/><animate attributeName="width" to="460" dur=".9s" begin="3.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="664" y="256" height="24" width="460"><set attributeName="width" to="0" begin="0s"/><set attributeName="width" to="460" begin="4.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="664" y="280" height="24" width="460"><set attributeName="width" to="0" begin="0s"/><set attributeName="width" to="460" begin="4.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l8"><rect x="664" y="304" height="24" width="460"><set attributeName="width" to="0" begin="0s"/><set attributeName="width" to="460" begin="5.0s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#0a0e14"/>
    <rect width="1200" height="440" fill="url(#dots)"/>
    <rect width="1200" height="440" fill="url(#g1)"/>
    <rect width="1200" height="440" fill="url(#g2)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="16" fill="none" stroke="#1f2630"/>

  <!-- identidade -->
  <g>
    <circle cx="70" cy="86" r="4.5" class="ok"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="84" y="91" class="mono kicker">DISPONÍVEL PARA PROJETOS</text>
  </g>
  <g>
    <text x="62" y="172" class="sans name">Maykon</text>
    <text x="62" y="250" class="sans name" fill="url(#ink)" style="fill:url(#ink)">Tardoche</text>
  </g>
  <g>
    <text x="66" y="296" class="sans role">Software Engineer · Full-stack</text>
    <text x="66" y="326" class="sans sub">Backend, banco de dados e produto de ponta a ponta —</text>
    <text x="66" y="348" class="sans sub">do schema no Postgres ao shader na GPU.</text>
  </g>
  <g>
    <text x="66" y="388" class="mono meta">São Paulo, BR  ·  programando desde 2008  ·  maykontardochedev.com</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="640" y="56" width="500" height="328" rx="12" fill="#0d1117" stroke="#262c36"/>
    <path d="M640 68a12 12 0 0 1 12-12h476a12 12 0 0 1 12 12v22H640z" fill="#161b22"/>
    <line x1="640" y1="90" x2="1140" y2="90" stroke="#262c36"/>
    <circle cx="664" cy="73" r="6" fill="#ff5f57"/>
    <circle cx="684" cy="73" r="6" fill="#febc2e"/>
    <circle cx="704" cy="73" r="6" fill="#28c840"/>
    <text x="890" y="78" text-anchor="middle" class="mono" font-size="12.5" fill="#6e7681">maykon@dev: ~</text>
  </g>

  <g class="mono t">
    <text x="664" y="130" clip-path="url(#l1)"><tspan class="p">❯</tspan> <tspan class="c">whoami</tspan></text>
    <text x="664" y="154" clip-path="url(#l2)"><tspan class="a">maykon</tspan> <tspan class="d">— engenheiro de software full-stack</tspan></text>

    <text x="664" y="190" clip-path="url(#l3)"><tspan class="p">❯</tspan> <tspan class="c">cat stack.txt</tspan></text>
    <text x="664" y="214" clip-path="url(#l4)"><tspan class="v">ts  nestjs  react  next  php  python  enforce</tspan></text>

    <text x="664" y="250" clip-path="url(#l5)"><tspan class="p">❯</tspan> <tspan class="c">npm test -- dinheiro</tspan></text>
    <text x="664" y="274" clip-path="url(#l6)"><tspan class="ok">✔</tspan><tspan class="d"> soma exata: 0.1 + 0.2 é 0.3</tspan></text>
    <text x="664" y="298" clip-path="url(#l7)"><tspan class="ok">✔</tspan><tspan class="d"> null NÃO vira zero: somar lança</tspan></text>
    <text x="664" y="322" clip-path="url(#l8)"><tspan class="ok">✔</tspan><tspan class="d"> fecha no centavo: 100 em três partes</tspan></text>

    <text x="664" y="356"><tspan class="p">❯</tspan><set attributeName="opacity" to="0" begin="0s"/><set attributeName="opacity" to="1" begin="5.4s" fill="freeze"/></text>
    <rect x="684" y="342" width="9" height="18" class="a">
      <set attributeName="opacity" to="0" begin="0s"/>
      <set attributeName="opacity" to="1" begin="5.4s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" begin="5.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
