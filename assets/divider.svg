<svg width="1000" height="20" viewBox="0 0 1000 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#bd93f9;#00d9ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="dglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="9" width="1000" height="2" fill="url(#dg)" opacity="0.75"/>

  <circle cy="10" r="4" fill="#00d9ff" filter="url(#dglow)">
    <animate attributeName="cx" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="10" r="2.5" fill="#bd93f9" filter="url(#dglow)">
    <animate attributeName="cx" values="1000;0;1000" dur="6s" repeatCount="indefinite"/>
  </circle>

  <path d="M500 4l6 6-6 6-6-6z" fill="#bd93f9" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
  </path>
</svg>
