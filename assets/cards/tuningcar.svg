<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310" role="img" aria-label="TuningCar: Showroom 3D de concessionária premium rodando em tempo real no navegador.">
  <style>
    .kicker { font: 600 11.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 1.8px; fill: #bd93f9; }
    .pill { font: 600 10.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 1.2px; fill: #bd93f9; }
    .title { font: 700 30px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -.6px; fill: #f0f6fc; }
    .tag { font: 400 15px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
    .bullet { font: 700 13px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #bd93f9; }
    .signal { font: 400 13.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #c9d1d9; }
    .chip { font: 500 12px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #c9d1d9; }
    .num { font: 800 120px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -6px; fill: #bd93f9; opacity: .055; }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#bd93f9"/><stop offset=".55" stop-color="#bd93f9" stop-opacity=".15"/><stop offset="1" stop-color="#bd93f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#bd93f9" stop-opacity=".13"/><stop offset=".6" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="580" height="310" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="580" height="310" fill="#0a0e14"/>
    <rect width="580" height="310" fill="url(#glow)"/>
    <text x="562" y="294" text-anchor="end" class="num">05</text>
    <rect width="580" height="3" fill="url(#edge)"/>
    <rect x="-120" width="120" height="3" fill="url(#shine)" opacity=".5">
      <animate attributeName="x" values="-120;580" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".5" y=".5" width="579" height="309" rx="14" fill="none" stroke="#1f2630"/>

  <circle cx="34" cy="40" r="4" fill="#bd93f9"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="46" y="44" class="kicker">CREATIVE DEV · WEBGL</text>
  <rect x="457" y="27" width="93" height="24" rx="12" fill="#bd93f9" fill-opacity=".1" stroke="#bd93f9" stroke-opacity=".45"/>
  <text x="503.5" y="43" text-anchor="middle" class="pill">PORTFÓLIO</text>

  <text x="30" y="92" class="title">TuningCar</text>
  <text x="30" y="120" class="tag">Showroom 3D de concessionária premium rodando</text>
  <text x="30" y="141" class="tag">em tempo real no navegador.</text>

  <line x1="30" y1="158" x2="550" y2="158" stroke="#1f2630"/>
  <g>
    <text x="30" y="184" class="bullet">▸</text>
    <text x="48" y="184" class="signal">Shaders GLSL: piso espelhado, fluido, aberração RGB</text>
  </g>
  <g>
    <text x="30" y="208" class="bullet">▸</text>
    <text x="48" y="208" class="signal">Scroll coreografado com GSAP, SplitText e Lenis</text>
  </g>
  <g>
    <text x="30" y="232" class="bullet">▸</text>
    <text x="48" y="232" class="signal">WebGL code-split, fallback estático, reduced-motion</text>
  </g>

  <rect x="30" y="258" width="80" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="70" y="275.5" text-anchor="middle" class="chip">Three.js</text>
  <rect x="118" y="258" width="51" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="143.5" y="275.5" text-anchor="middle" class="chip">GLSL</text>
  <rect x="177" y="258" width="51" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="202.5" y="275.5" text-anchor="middle" class="chip">GSAP</text>
  <rect x="236" y="258" width="95" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="283.5" y="275.5" text-anchor="middle" class="chip">TypeScript</text>
  <rect x="339" y="258" width="51" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="364.5" y="275.5" text-anchor="middle" class="chip">Vite</text>
</svg>
