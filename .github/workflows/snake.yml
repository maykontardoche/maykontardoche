# ═══════════════════════════════════════════════════════════════
#  SNAKE ANIMATION — Gera a cobrinha que devora suas contribuições
#  Salve este arquivo em: .github/workflows/snake.yml
#  (no repositório maykontardoche/maykontardoche)
#
#  Se a snake já funciona no seu perfil hoje, você NÃO precisa
#  deste arquivo — ele já existe no seu repositório.
# ═══════════════════════════════════════════════════════════════

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia à meia-noite (UTC)
  workflow_dispatch:        # permite rodar manualmente na aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: maykontardoche
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
