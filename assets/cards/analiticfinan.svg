<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310" role="img" aria-label="AnaliticFinan: Sistema financeiro corporativo e auditável, onde arredondar errado vira problema contábil.">
  <style>
    .kicker { font: 600 11.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 1.8px; fill: #00d9ff; }
    .pill { font: 600 10.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 1.2px; fill: #00d9ff; }
    .title { font: 700 30px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -.6px; fill: #f0f6fc; }
    .tag { font: 400 15px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
    .bullet { font: 700 13px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #00d9ff; }
    .signal { font: 400 13.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #c9d1d9; }
    .chip { font: 500 12px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #c9d1d9; }
    .num { font: 800 120px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -6px; fill: #00d9ff; opacity: .055; }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#00d9ff"/><stop offset=".55" stop-color="#00d9ff" stop-opacity=".15"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#00d9ff" stop-opacity=".13"/><stop offset=".6" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="580" height="310" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="580" height="310" fill="#0a0e14"/>
    <rect width="580" height="310" fill="url(#glow)"/>
    <text x="562" y="294" text-anchor="end" class="num">01</text>
    <rect width="580" height="3" fill="url(#edge)"/>
    <rect x="-120" width="120" height="3" fill="url(#shine)" opacity=".5">
      <animate attributeName="x" values="-120;580" dur="3.2s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".5" y=".5" width="579" height="309" rx="14" fill="none" stroke="#1f2630"/>

  <circle cx="34" cy="40" r="4" fill="#00d9ff"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="46" y="44" class="kicker">FINTECH · BACKEND</text>
  <rect x="472" y="27" width="78" height="24" rx="12" fill="#00d9ff" fill-opacity=".1" stroke="#00d9ff" stroke-opacity=".45"/>
  <text x="511" y="43" text-anchor="middle" class="pill">PRIVADO</text>

  <text x="30" y="92" class="title">AnaliticFinan</text>
  <text x="30" y="120" class="tag">Sistema financeiro corporativo e auditável, onde</text>
  <text x="30" y="141" class="tag">arredondar errado vira problema contábil.</text>

  <line x1="30" y1="158" x2="550" y2="158" stroke="#1f2630"/>
  <g>
    <text x="30" y="184" class="bullet">▸</text>
    <text x="48" y="184" class="signal">Dinheiro nunca é number: Decimal ponta a ponta</text>
  </g>
  <g>
    <text x="30" y="208" class="bullet">▸</text>
    <text x="48" y="208" class="signal">Rateio que fecha no centavo; null não é zero</text>
  </g>
  <g>
    <text x="30" y="232" class="bullet">▸</text>
    <text x="48" y="232" class="signal">Calendário fiscal: dias úteis, competência, fuso SP</text>
  </g>

  <rect x="30" y="258" width="88" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="74" y="275.5" text-anchor="middle" class="chip">NestJS 11</text>
  <rect x="126" y="258" width="117" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="184.5" y="275.5" text-anchor="middle" class="chip">PostgreSQL 17</text>
  <rect x="251" y="258" width="59" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="280.5" y="275.5" text-anchor="middle" class="chip">Redis</text>
  <rect x="318" y="258" width="66" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="351" y="275.5" text-anchor="middle" class="chip">Prisma</text>
  <rect x="392" y="258" width="66" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="425" y="275.5" text-anchor="middle" class="chip">Docker</text>
</svg>
