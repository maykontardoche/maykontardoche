<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310" role="img" aria-label="Beatriz Agatha Beauty: Site editável, agenda com sinal, cursos e painel de gestão para um estúdio de beleza.">
  <style>
    .kicker { font: 600 11.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 1.8px; fill: #f778ba; }
    .pill { font: 600 10.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 1.2px; fill: #f778ba; }
    .title { font: 700 30px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -.6px; fill: #f0f6fc; }
    .tag { font: 400 15px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
    .bullet { font: 700 13px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #f778ba; }
    .signal { font: 400 13.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #c9d1d9; }
    .chip { font: 500 12px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #c9d1d9; }
    .num { font: 800 120px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -6px; fill: #f778ba; opacity: .055; }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#f778ba"/><stop offset=".55" stop-color="#f778ba" stop-opacity=".15"/><stop offset="1" stop-color="#f778ba" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#f778ba" stop-opacity=".13"/><stop offset=".6" stop-color="#f778ba" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="580" height="310" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="580" height="310" fill="#0a0e14"/>
    <rect width="580" height="310" fill="url(#glow)"/>
    <text x="562" y="294" text-anchor="end" class="num">03</text>
    <rect width="580" height="3" fill="url(#edge)"/>
    <rect x="-120" width="120" height="3" fill="url(#shine)" opacity=".5">
      <animate attributeName="x" values="-120;580" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".5" y=".5" width="579" height="309" rx="14" fill="none" stroke="#1f2630"/>

  <circle cx="34" cy="40" r="4" fill="#f778ba"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="46" y="44" class="kicker">SAAS · CLIENTE REAL</text>
  <rect x="472" y="27" width="78" height="24" rx="12" fill="#f778ba" fill-opacity=".1" stroke="#f778ba" stroke-opacity=".45"/>
  <text x="511" y="43" text-anchor="middle" class="pill">PRIVADO</text>

  <text x="30" y="92" class="title">Beatriz Agatha Beauty</text>
  <text x="30" y="120" class="tag">Site editável, agenda com sinal, cursos e painel</text>
  <text x="30" y="141" class="tag">de gestão para um estúdio de beleza.</text>

  <line x1="30" y1="158" x2="550" y2="158" stroke="#1f2630"/>
  <g>
    <text x="30" y="184" class="bullet">▸</text>
    <text x="48" y="184" class="signal">Reserva só confirma com sinal pago (Pix/cartão)</text>
  </g>
  <g>
    <text x="30" y="208" class="bullet">▸</text>
    <text x="48" y="208" class="signal">Horário sobreposto é impossível: EXCLUDE no Postgres</text>
  </g>
  <g>
    <text x="30" y="232" class="bullet">▸</text>
    <text x="48" y="232" class="signal">LGPD: dados cifrados, acesso auditado, exportação</text>
  </g>

  <rect x="30" y="258" width="95" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="77.5" y="275.5" text-anchor="middle" class="chip">Next.js 16</text>
  <rect x="133" y="258" width="80" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="173" y="275.5" text-anchor="middle" class="chip">Supabase</text>
  <rect x="221" y="258" width="110" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="276" y="275.5" text-anchor="middle" class="chip">Mercado Pago</text>
  <rect x="339" y="258" width="117" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="397.5" y="275.5" text-anchor="middle" class="chip">Google Agenda</text>
</svg>
