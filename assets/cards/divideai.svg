<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310" role="img" aria-label="DivideAí V2: Sistema operacional da casa e da vida financeira compartilhada: dinheiro entre pessoas, num só lugar.">
  <style>
    .kicker { font: 600 11.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 1.8px; fill: #3fb950; }
    .pill { font: 600 10.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 1.2px; fill: #3fb950; }
    .title { font: 700 30px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -.6px; fill: #f0f6fc; }
    .tag { font: 400 15px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
    .bullet { font: 700 13px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #3fb950; }
    .signal { font: 400 13.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #c9d1d9; }
    .chip { font: 500 12px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #c9d1d9; }
    .num { font: 800 120px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -6px; fill: #3fb950; opacity: .055; }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#3fb950"/><stop offset=".55" stop-color="#3fb950" stop-opacity=".15"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity=".13"/><stop offset=".6" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="580" height="310" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="580" height="310" fill="#0a0e14"/>
    <rect width="580" height="310" fill="url(#glow)"/>
    <text x="562" y="294" text-anchor="end" class="num">02</text>
    <rect width="580" height="3" fill="url(#edge)"/>
    <rect x="-120" width="120" height="3" fill="url(#shine)" opacity=".5">
      <animate attributeName="x" values="-120;580" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".5" y=".5" width="579" height="309" rx="14" fill="none" stroke="#1f2630"/>

  <circle cx="34" cy="40" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="46" y="44" class="kicker">PRODUTO · FULL-STACK</text>
  <rect x="428" y="27" width="122" height="24" rx="12" fill="#3fb950" fill-opacity=".1" stroke="#3fb950" stroke-opacity=".45"/>
  <text x="489" y="43" text-anchor="middle" class="pill">EM CONSTRUÇÃO</text>

  <text x="30" y="92" class="title">DivideAí V2</text>
  <text x="30" y="120" class="tag">Sistema operacional da casa e da vida financeira</text>
  <text x="30" y="141" class="tag">compartilhada: dinheiro entre pessoas, num só lugar.</text>

  <line x1="30" y1="158" x2="550" y2="158" stroke="#1f2630"/>
  <g>
    <text x="30" y="184" class="bullet">▸</text>
    <text x="48" y="184" class="signal">Monorepo NestJS 12 + Prisma 7 + React 19 (PWA)</text>
  </g>
  <g>
    <text x="30" y="208" class="bullet">▸</text>
    <text x="48" y="208" class="signal">Contrato OpenAPI gerado e conferido no CI</text>
  </g>
  <g>
    <text x="30" y="232" class="bullet">▸</text>
    <text x="48" y="232" class="signal">Gates: typecheck, e2e Playwright, audit com prazo</text>
  </g>

  <rect x="30" y="258" width="95" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="77.5" y="275.5" text-anchor="middle" class="chip">TypeScript</text>
  <rect x="133" y="258" width="66" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="166" y="275.5" text-anchor="middle" class="chip">NestJS</text>
  <rect x="207" y="258" width="66" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="240" y="275.5" text-anchor="middle" class="chip">Prisma</text>
  <rect x="281" y="258" width="59" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="310.5" y="275.5" text-anchor="middle" class="chip">React</text>
  <rect x="348" y="258" width="80" height="26" rx="13" fill="#161b22" stroke="#262c36"/>
  <text x="388" y="275.5" text-anchor="middle" class="chip">Supabase</text>
</svg>
